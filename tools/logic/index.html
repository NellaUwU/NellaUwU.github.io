<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        table {
            border: 1px solid #000;
        }
        tbody > tr {
            text-align: center;
            &:nth-child(odd)  > .tBody { background-color: #7F7FFF; }
            &:nth-child(even) > .tBody { background-color: #CFCFFF; }
        }
        .found {
            white-space: pre-wrap;
        }
    </style>
    <input type="text" name="" id="" class="input">
    <p class="output"></p>
    <table class="table">
        <thead>
            <tr>
                <th scrope="col">In</th>
                <th scrope="col" class="tHead"></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">1 1</th>
                <td class="tBody"></td>
            </tr>
            <tr>
                <th scope="row">1 0</th>
                <td class="tBody"></td>
            </tr>
            <tr>
                <th scope="row">0 1</th>
                <td class="tBody"></td>
            </tr>
            <tr>
                <th scope="row">0 0</th>
                <td class="tBody"></td>
            </tr>
        </tbody>
    </table>
    <div class="found"></div>
    <button class="fBtn" onclick="addFound()">Add</button>
    <button class="fBtn" onclick="editFound()">Edit</button>
    <script>
        const inp = document.querySelector(".input");
        const out = document.querySelector(".output");
        const tab = document.querySelector(".table");
        const found = document.querySelector(".found");
        let F = JSON.parse(localStorage.getItem("/tools/logic/found"));
        if (!F) {
            F = [
                "!A\t\t = A => 0",
                "A∧B\t = !(A > !B)  | (A > (B > 0)) > 0"
            ];
            localStorage.setItem("/tools/logic/found", JSON.stringify(F));
        }
        F.forEach(f => {
            found.textContent += `\n${f}`;
        });
        inp.addEventListener("input", e => update(e));
        function update(e) {
            console.log("UPDATING..");
            const tHead = tab.querySelector(".tHead");
            const tBodies = tab.querySelectorAll(".tBody");
            const string = inp.value || "N";
            tHead.textContent = "Calc";
            const abcd = [ [1, 1], [1, 0], [0, 1], [0, 0] ];
            let i = 0;
            tBodies.forEach(b => {
                const s = string
                    .toLowerCase()
                    .replace(/(?<!\\)>/g, "<=")
                    .replace(/\\>/g, ">")
                    .replace(/a/g, Boolean(abcd[i][0]))
                    .replace(/b/g, Boolean(abcd[i][1]));
                console.log(s);
                try {
                    const res = (0, eval)(s); 
                    b.textContent = Number(res);
                } catch (error) {
                    b.textContent = "N";
                }
                i++;
            });
        }
        function addFound() {
            const val = prompt("Enter the syntax");
            F.push(val);
            localStorage.setItem("/tools/logic/found", JSON.stringify(F));
            found.textContent = "";
            F.forEach(f => {
                found.textContent += `\n${f}`;
            });
        }
        function editFound() {
            const val = prompt("JSON", JSON.stringify(F));
            localStorage.setItem("/tools/logic/found", val);
        }
    </script>
</body>
</html>
